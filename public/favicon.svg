  <g>
    <ellipse cx="48" cy="68" rx="13.5" ry="15.5" fill="#fff"/>
    <ellipse cx="80" cy="68" rx="13.5" ry="15.5" fill="#fff"/>
    <circle cx="50" cy="71" r="7.5" fill="#161616"/>
    <circle cx="78" cy="71" r="7.5" fill="#161616"/>
  </g>
  <!-- nostrils -->
  <g fill="#2f6b23">

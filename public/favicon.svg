    <path d="M83 30c11-12 15-24 12-28-9 4-18 15-22 30z"/>
  </g>
  <!-- ears -->
  <g fill="#57b23f" stroke="#2f6b23" stroke-width="4.5" stroke-linejoin="round">
    <path d="M27 62 13 55l9 16z"/>
    <path d="M101 62l14-7-9 16z"/>
  </g>
  <!-- head -->
  <path d="M64 16c29 0 41 19 41 44 0 30-19 50-41 50S23 90 23 60c0-25 12-44 41-44z"

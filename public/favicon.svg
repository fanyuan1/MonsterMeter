    <ellipse cx="70" cy="86" rx="2.6" ry="3.6"/>
  </g>
  <!-- mouth -->
  <path d="M38 97c9-8 43-8 52 0-9 13-43 13-52 0z" fill="#241016"/>
  <!-- fangs -->
  <g fill="#fff" stroke="#2f6b23" stroke-width="2.5" stroke-linejoin="round">
